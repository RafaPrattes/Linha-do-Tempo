<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linha do Tempo dos Atos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<style>
  :root {
    --primary-color: #0077cc;
    --bg-color: #f5f5f5;
    --card-bg: #ffffff;
    --text-color: #333;
    --text-muted: #666;
    --focus-color: #ff9900; /* Laranja de Acessibilidade */
  }

  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); margin: 0; padding: 20px; color: var(--text-color); }
  
  h1 { text-align: center; color: var(--primary-color); margin-bottom: 30px; }
  
  .controls { text-align: center; margin-bottom: 20px; }
  select { padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; }

  /* Container da Linha do Tempo */
  #timeline-container { 
    display: flex;
    overflow-x: auto; 
    padding: 20px 10px; 
    gap: 20px;
    scroll-behavior: smooth;
    align-items: stretch;
  }

  #timeline-container::-webkit-scrollbar { height: 8px; }
  #timeline-container::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
  #timeline-container::-webkit-scrollbar-thumb:hover { background: var(--primary-color); }

  /* CARD */
  .timeline-item {
    flex: 0 0 280px;
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
    border: 1px solid transparent;
    position: relative;
    overflow: hidden;
  }

  .timeline-item:hover, .timeline-item.active {
    transform: translateY(-5px);
    box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    border-color: var(--primary-color);
  }

  .timeline-item.active { background-color: #eef7ff; }

  .card-header {
    padding: 15px 15px 5px;
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .card-body {
    padding: 5px 15px 15px;
    flex-grow: 1;
  }

  .card-title {
    margin: 0;
    font-size: 1.1rem;
    color: var(--primary-color);
    font-weight: bold;
    line-height: 1.4;
  }

  .card-footer {
    background: #fafafa;
    padding: 12px 5px;
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    border-top: 1px solid #eee;
  }

  .action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--text-muted);
    border: none;
    background: none;
    cursor: pointer;
    transition: all 0.2s;
    flex: 1;
    min-width: 60px;
    padding: 4px;
    border-radius: 6px;
  }

  .btn-icon { font-size: 1.4rem; margin-bottom: 4px; line-height: 1; }
  .btn-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }

  .action-btn:hover { color: var(--primary-color); background-color: rgba(0, 119, 204, 0.05); }
  
  /* FOCO DE ACESSIBILIDADE */
  button:focus-visible, a:focus-visible, select:focus-visible, iframe:focus {
    outline: 4px solid var(--focus-color); /* Borda Laranja Grossa */
    outline-offset: 2px;
    box-shadow: 0 0 8px rgba(0,0,0,0.5);
    z-index: 10;
  }

  /* Visualizador PDF */
  #pdf-viewer { 
    margin-top: 30px; 
    width: 100%; 
    height: 700px; 
    border: 1px solid #ddd;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0,0,0,0.05);
    background: #fff;
    scroll-margin-top: 20px; /* Espaço extra ao rolar */
  }
</style>
</head>
<body>

<h1>Linha do Tempo dos Atos</h1>

<div class="controls">
  <label for="filter">Filtrar por ano:</label>
  <select id="filter">
    <option value="all">Todos os anos</option>
  </select>
</div>

<div id="timeline-container" role="list" aria-label="Lista de Atos Normativos"></div>

<iframe id="pdf-viewer" title="Visualizador de documentos" aria-label="Visualizador de PDF" tabindex="0"></iframe>

<script>
const url = "./orgaos-judicantes.csv"; 
let timelineData = [];

function createElement(tag, className, textContent) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (textContent) el.textContent = textContent;
  return el;
}

function parseDateFromRow(row) {
  const year = parseInt(row[0]);
  const month = parseInt(row[1]) - 1; 
  const day = parseInt(row[2]);

  if (!isNaN(year) && !isNaN(month) && !isNaN(day)) {
    return new Date(year, month, day);
  }
  
  const displayDate = row[9];
  if (displayDate) {
    const parts = displayDate.split('/');
    if (parts.length === 3) {
      return new Date(parts[2], parts[1] - 1, parts[0]);
    }
  }
  return new Date(NaN);
}

function createTimelineItem(row) {
  const ano = row[0];
  const dataVisual = row[9] || `${row[2]}/${row[1]}/${row[0]}`; 
  const rawPdf = row[11] ? row[11].trim() : "";
  const rawJus = row[12] ? row[12].trim() : "";
  const nomeAto = row[13] ? row[13].replace(/"/g, '').trim() : "Sem título";

  // Validação PDF
  const hasPdf = rawPdf.length > 5 && rawPdf.toLowerCase().startsWith("http");
  const pdfLink = hasPdf ? rawPdf : "#";

  // Validação Juslaboris 
  const hasJusLink = rawJus.length > 5 && rawJus.toLowerCase().startsWith("http");
  const finalJusLink = hasJusLink ? rawJus : "#";
  const jusTooltip = hasJusLink ? "Acessar link oficial" : "Link indisponível na planilha";

  // CARD
  const card = createElement('div', 'timeline-item');
  card.dataset.year = ano || "Geral";
  card.setAttribute("role", "listitem");

  const header = createElement('div', 'card-header', dataVisual);
  const body = createElement('div', 'card-body');
  
  // Título (Apenas Texto)
  const titleEl = createElement('h3', 'card-title', nomeAto);
  titleEl.style.fontSize = "1.1rem"; 
  body.appendChild(titleEl);

  const footer = createElement('div', 'card-footer');

  function createIconBtn(icon, label, titleAttr, linkUrl, isValid, isActionBtn = false) {
    const tag = (isValid && !isActionBtn) ? 'a' : 'button';
    const btn = document.createElement(tag);
    btn.className = 'action-btn';
    btn.innerHTML = `<span class="btn-icon" aria-hidden="true">${icon}</span><span class="btn-label">${label}</span>`;

    if (!isValid) {
      btn.removeAttribute("href");
      btn.style.opacity = "0.3";
      btn.style.cursor = "not-allowed";
      btn.setAttribute("aria-disabled", "true");
      if (tag === 'button') btn.disabled = true; 
    } else {
      btn.title = titleAttr;
      if (!isActionBtn) {
        btn.href = linkUrl;
        btn.target = "_blank";
      }
    }
    return btn;
  }

  // Ações
  const btnView = createIconBtn('👁️', 'Visualizar', 'Ver aqui', null, hasPdf, true);
  const btnPdf = createIconBtn('📄', 'Baixar', 'Abrir PDF', pdfLink, hasPdf, false);
  const btnJus = createIconBtn('⚖️', 'Juslaboris', jusTooltip, finalJusLink, hasJusLink, false);

  footer.append(btnView, btnPdf, btnJus);
  card.append(header, body, footer);

  // --- LÓGICA DE PREVIEW COM FOCO ---
  function openPreview(e) {
    if(e) e.preventDefault();
    if (!hasPdf) return;

    document.querySelectorAll(".timeline-item").forEach(i => {
      i.classList.remove("active");
      i.removeAttribute("aria-current");
    });
    card.classList.add("active");
    card.setAttribute("aria-current", "true");
    
    let embedLink = pdfLink;
    if (embedLink.includes("drive.google.com")) {
        embedLink = embedLink.replace("/view", "/preview");
    }

    const viewer = document.getElementById("pdf-viewer");
    viewer.src = embedLink;
    
    // 1. Rola a tela até o viewer
    viewer.scrollIntoView({ behavior: 'smooth', block: 'center' });
    
    // 2. Transfere o foco para o Iframe (Acessibilidade)
    // Pequeno delay para esperar a rolagem
    setTimeout(() => {
        viewer.focus();
    }, 500);
  }

  if (hasPdf) {
    btnView.addEventListener("click", openPreview);
  }

  return card;
}

Papa.parse(url, {
  download: true,
  header: false,
  skipEmptyLines: true,
  encoding: "UTF-8",
  complete: function(results) {
    const data = results.data;
    timelineData = data.filter(row => {
      const year = parseInt(row[0]);
      const title = row[13];
      return !isNaN(year) && year > 1900 && title && title.trim() !== "";
    });

    timelineData.sort((a, b) => {
      const dateA = parseDateFromRow(a);
      const dateB = parseDateFromRow(b);
      return dateB - dateA;
    });

    renderTimeline(timelineData);
    setupFilter();
  }
});

function renderTimeline(dataToRender) {
  const container = document.getElementById("timeline-container");
  container.innerHTML = "";
  if (dataToRender.length === 0) {
    container.innerHTML = "<p style='padding:20px; text-align:center'>Nenhum ato encontrado.</p>";
    return;
  }
  dataToRender.forEach(row => {
    container.appendChild(createTimelineItem(row));
  });
}

function setupFilter() {
  const years = [...new Set(timelineData.map(r => r[0]))].sort((a,b) => b-a);
  const filter = document.getElementById("filter");
  filter.innerHTML = '<option value="all">Todos os anos</option>'; 
  years.forEach(y => {
    const option = document.createElement("option");
    option.value = y;
    option.textContent = y;
    filter.appendChild(option);
  });
}

document.getElementById("filter").addEventListener("change", (e) => {
  const year = e.target.value;
  const filteredData = timelineData.filter(row => {
    return year === "all" || row[0] == year;
  });
  renderTimeline(filteredData);
  document.getElementById("pdf-viewer").src = "";
});
</script>

</body>
</html>
